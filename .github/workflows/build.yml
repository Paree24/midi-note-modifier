name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libwebkit2gtk-4.1-dev xvfb

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCH_FLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then ARCH_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $ARCH_FLAGS

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build checks (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --target UiShot HostCheck -j $(nproc)

      - name: UiShot checks (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: UISHOT_OUT="$GITHUB_WORKSPACE/ui.png" xvfb-run -a ./build/UiShot

      - name: HostCheck (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/HostCheck "build/MidiNoteModifier_artefacts/Release/VST3/Midi Note Modifier.vst3"

      - name: Upload UI screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: ui.png

      - name: Package VST3
        shell: bash
        run: |
          cd "build/MidiNoteModifier_artefacts/Release/VST3"
          cmake -E tar czf "$GITHUB_WORKSPACE/Midi-Note-Modifier-${{ matrix.name }}-vst3.tar.gz" "Midi Note Modifier.vst3"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst3-${{ matrix.name }}
          path: Midi-Note-Modifier-${{ matrix.name }}-vst3.tar.gz

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vst3-*
          merge-multiple: true

      - name: Attach to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Refresh rolling auto release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete auto --cleanup-tag -y || true
          gh release create auto --prerelease --title "auto" \
            --notes "Rolling auto-build from the latest green main commit. Linux / Windows / macOS (universal) VST3. For stable versions see the v* releases." \
            dist/*
